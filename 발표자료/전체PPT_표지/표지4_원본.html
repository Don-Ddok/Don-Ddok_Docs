<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>cover4</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --paper: #FFFFFF; --lime: #9BD84E; --lime-deep: #4F9A1C; --lime-soft: #E6F7CF;
    --orange: #F0875A; --ink: #16301A; --muted: rgba(22,48,26,.6);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { zoom: 2; }
  body { width: 1920px; height: 1080px; overflow: hidden; font-family: Pretendard, 'Noto Sans KR', sans-serif; color: var(--ink); background: transparent; }
  .slide { position: relative; width: 1920px; height: 1080px; background: var(--paper); overflow: hidden; }
  svg.art { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .brand { position: absolute; left: 120px; top: 84px; display: flex; align-items: center; gap: 16px; }
  .brand .name { font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
  .brand .en { font-size: 18px; font-weight: 500; color: var(--muted); letter-spacing: 1px; margin-left: 4px; }
  .org { position: absolute; right: 110px; top: 98px; font-size: 20px; font-weight: 600; color: rgba(22,48,26,.72); }
  .main { position: absolute; left: 120px; top: 318px; width: 980px; }
  .chip { display: inline-block; padding: 10px 22px; border-radius: 999px; background: var(--lime-soft); color: var(--lime-deep); font-size: 22px; font-weight: 700; letter-spacing: .2px; }
  h1 { margin-top: 34px; font-size: 96px; line-height: 1.12; font-weight: 800; letter-spacing: -3.4px; }
  h1 em { font-style: normal; box-shadow: inset 0 -26px 0 rgba(155,216,78,.75); }
  .sub { margin-top: 34px; font-size: 34px; font-weight: 500; color: rgba(22,48,26,.86); letter-spacing: -.8px; }
  .sub b { font-weight: 800; color: var(--lime-deep); }
  .foot { position: absolute; left: 120px; bottom: 84px; width: 900px; padding-top: 26px; border-top: 1px solid rgba(22,48,26,.14); font-size: 21px; color: var(--muted); display: flex; justify-content: space-between; }
  .foot strong { color: var(--ink); font-weight: 700; margin-right: 18px; }
  .tag { font-family: Pretendard, sans-serif; font-weight: 700; }
  /* ?mode=bg 배경만 */
  body.bg .brand, body.bg .org, body.bg .main, body.bg .foot { display: none; }
</style></head>
<body>
<div class="slide">
  <svg class="art" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#DDF4B6"/><stop offset="1" stop-color="#A7DD5E"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2E5A12" flood-opacity=".18"/>
      </filter>
      <clipPath id="lens"><circle cx="1600" cy="585" r="150"/></clipPath>
      <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="2.2" fill="rgba(79,154,28,.22)"/>
      </pattern>
    </defs>

    <!-- 오른쪽 연두 패널 -->
    <rect x="1170" y="-60" width="820" height="1200" rx="72" fill="url(#panel)"/>
    <rect x="1170" y="690" width="260" height="330" fill="url(#dots)" opacity=".9"/>
    <circle cx="1880" cy="120" r="150" fill="rgba(255,255,255,.28)"/>

    <!-- 장부 카드 -->
    <g filter="url(#shadow)">
      <rect x="1270" y="250" width="540" height="580" rx="26" fill="#fff"/>
    </g>
    <rect x="1310" y="292" width="170" height="16" rx="8" fill="#16301A" opacity=".82"/>
    <rect x="1310" y="322" width="110" height="12" rx="6" fill="#16301A" opacity=".22"/>
    <g fill="#16301A" opacity=".08">
      <rect x="1310" y="720" width="460" height="12" rx="6"/>
      <rect x="1310" y="748" width="380" height="12" rx="6"/>
      <rect x="1310" y="776" width="420" height="12" rx="6"/>
    </g>
    <g stroke="rgba(22,48,26,.08)" stroke-width="1">
      <line x1="1310" y1="420" x2="1770" y2="420"/><line x1="1310" y1="500" x2="1770" y2="500"/>
      <line x1="1310" y1="580" x2="1770" y2="580"/><line x1="1310" y1="660" x2="1770" y2="660"/>
    </g>
    <!-- 평균선: 평평하다 -->
    <path d="M1310 585 C1380 580 1440 590 1500 584 S1640 588 1770 583" fill="none" stroke="rgba(22,48,26,.35)" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="1310" y="560" class="tag" font-size="17" fill="rgba(22,48,26,.5)">평균</text>

    <!-- 돋보기: 안에서만 갈라진다 -->
    <circle cx="1600" cy="585" r="150" fill="#F7FDEE"/>
    <g clip-path="url(#lens)">
      <path d="M1450 585 L1760 585" stroke="rgba(22,48,26,.12)" stroke-width="2"/>
      <path d="M1450 590 C1510 588 1550 585 1590 578 S1680 540 1760 505" fill="none" stroke="#4F9A1C" stroke-width="6" stroke-linecap="round"/>
      <path d="M1450 590 C1510 592 1550 596 1590 604 S1680 648 1760 682" fill="none" stroke="#F0875A" stroke-width="6" stroke-linecap="round"/>
      <circle cx="1590" cy="578" r="7" fill="#4F9A1C"/><circle cx="1590" cy="604" r="7" fill="#F0875A"/>
    </g>
    <circle cx="1600" cy="585" r="150" fill="none" stroke="#16301A" stroke-width="14"/>
    <line x1="1708" y1="693" x2="1800" y2="785" stroke="#16301A" stroke-width="26" stroke-linecap="round"/>
    <text x="1655" y="530" class="tag" font-size="18" fill="#4F9A1C">노출</text>
    <text x="1640" y="668" class="tag" font-size="18" fill="#D9683A">비노출</text>
  </svg>

  <div class="brand">
    <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
      <rect width="52" height="52" rx="13" fill="#16301A"/>
      <circle cx="21" cy="26" r="12" fill="#F0875A"/>
      <circle cx="31" cy="26" r="12" fill="#9BD84E" fill-opacity=".9"/>
    </svg>
    <span class="name">돈독</span><span class="en">DON-DDOK</span>
  </div>
  <div class="org">iM DiGital Banker Academy 9기 · 통계 프로젝트</div>

  <div class="main">
    <span class="chip">대구·경북 법인 36개월 은행 데이터 분석</span>
    <h1>착시를 걷어낸<br><em>은행 장부</em></h1>
    <div class="sub">수출이 기침하면 <b>먼저 우는 계좌</b></div>
  </div>

  <div class="foot">
    <div><strong>팀 돈독</strong>신다혜 · 허민영 · 이성진 · 장재열 · 전유환</div>
    <div>2026.09.21 – 10.07</div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search).get('mode') || '';
  q.split(',').filter(Boolean).forEach(c => document.body.classList.add(c));
</script>
</body></html>
